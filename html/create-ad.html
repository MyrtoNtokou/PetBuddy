<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetBuddy - Δημιουργία Αγγελίας</title>
    
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- CSS Variables & Components -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">    
</head>
<body>
    <!-- Header -->
    <header>
        <a href="browser.html" class="logo">
            <span class="material-symbols-outlined">pets</span>
            <span>PetBuddy</span>
        </a>

        <nav>
            <a href="browser.html" class="nav-link">
                <span class="material-symbols-outlined">search</span>
                <span>Αγγελίες</span>
            </a>

            <a href="create-ad.html" class="nav-link active">
                <span class="material-symbols-outlined">add_circle</span>
                <span>Νέα Αγγελία</span>
            </a>

            <a href="applications.html" class="nav-link">
                <span class="material-symbols-outlined">mail</span>
                <span>Inbox</span>
            </a>
        </nav>

        <div class="profile-container">
            <a href="profile.html" class="profile-btn" title="Λογαριασμός">
                <span class="material-symbols-outlined">account_circle</span>
            </a>

            <div class="profile-dropdown">
                <a href="profile.html">
                    <span class="material-symbols-outlined" style="font-size: 1.15rem;">person</span>
                    <span>Το προφίλ μου</span>
                </a>

                <div class="dropdown-divider"></div>

                <a href="login.html" class="logout-link">
                    <span class="material-symbols-outlined" style="font-size: 1.15rem;">logout</span>
                    <span>Αποσύνδεση</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Κεντραρισμένος τίτλος ακριβώς όπως στην εικόνα -->
        <h1> Δημιουργία Νέας Αγγελίας </h1>

        <div class="card">
            <form id="adForm" action="applications.html" method="get">
                
                <div class="form-group">
                    <label for="dogSelect"><strong>1. Επιλογή Κατοικιδίου</strong></label>
                    <select id="dogSelect" required>
                        <option value="">-- Επιλέξτε το κατοικίδιο σας --</option>
                        <option value="rex">Ρεξ (Golden Retriever, 3 ετών)</option>
                        <option value="luna">Λούνα (Ημίαιμο, 1 έτους)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="serviceType"><strong>2. Τύπος Υπηρεσίας</strong></label>
                    <select id="serviceType" required>
                        <option value="WALKING" selected>Βόλτα</option>
                        <option value="BOARDING">Φιλοξενία</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="adTitle"><strong>Τίτλος Αγγελίας</strong></label>
                    <input type="text" id="adTitle" placeholder="π.χ. Απογευματινή βόλτα στο πάρκο" required>
                </div>

                <div class="form-group">
                    <label for="cityArea"><strong>Περιοχή</strong></label>
                    <input type="text" id="cityArea" placeholder="π.χ. Κολωνάκι, Αθήνα" required>
                </div>

                <div class="form-group">
                    <label for="adDate"><strong>Ημερομηνία</strong></label>
                    <input type="date" id="adDate" value="2026-11-07" required>
                </div>
                
                <div class="form-group">
                    <label for="notes"><strong>Περιγραφή</strong></label>
                    <textarea id="notes" rows="4" placeholder="Ειδικές ανάγκες, χαρακτήρας σκύλου, ώρες..."></textarea>
                </div>

                <!-- Κουμπί Δημοσίευσης δεξιά -->
                <div class="button-group" style="justify-content: flex-end; margin-top: var(--spacing-lg); margin-bottom: 0;">
                    <a href="applications.html" class="btn btn-primary" style="padding: 10px 24px; font-weight: bold; text-decoration: none; display: inline-block;">
                        Δημοσίευση Αγγελίας
                    </a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        &copy; 2026 PetBuddy
    </footer>
</body>
</html>
